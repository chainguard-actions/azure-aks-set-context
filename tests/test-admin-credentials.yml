name: Test admin credentials flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          resource-group: my-resource-group
          cluster-name: my-aks-cluster
          admin: 'true'
        continue-on-error: true
      - name: Assert action ran and failed gracefully (no Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Azure credentials available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with admin=true (Azure credentials were available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
